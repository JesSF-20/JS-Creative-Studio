<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="CSS/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/eb496ab1a0.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <nav class="navbar">
      <div class="logo-container">
        <img src="img/logo_tics.ico" alt="Logo" class="nav-logo" />
        <div class="logo">JESÚS<span>SÁNCHEZ</span></div>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>

        <li><a href="contacto.html" class="nav-btn">Presupuesto</a></li>
      </ul>
    </nav>

<section id="contacto" class="container">
    <h2 class="section-title">¿Tienes un <span>Proyecto?</span></h2>
    
    <div class="contact-wrapper">
        
        <div class="contact-info">
            <img src="img/tec.jpg" alt="Diseño Creativo" class="contact-info-img">
        </div>
        
        <form action="https://formspree.io/f/flosejo0604@gmail.com" method="POST" class="contact-form">
            <div class="form-row">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" name="nombre" placeholder="Tu Nombre" required>
                </div>
                <div class="form-group">
                    <label>Correo electrónico *</label>
                    <input type="email" name="email" placeholder="Tu Email" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Asunto del proyecto</label>
                <input type="text" name="asunto" placeholder="Ej. Cotización Sitio Web" required>
            </div>
            
            <div class="form-group">
                <label>Tu mensaje</label>
                <textarea name="mensaje" placeholder="Háblame de tu proyecto..." rows="5" required></textarea>
            </div>
            
            <button type="submit" class="submit-btn">Enviar Mensaje</button>
        </form>

        <div class="contact-bottom">
            <a href="https://wa.me/525570707276" class="bottom-info-item" target="_blank">
                <img src="img/whats.png" alt="WhatsApp">
                <span>55-70-70-72-76</span>
            </a>
            
            <a href="mailto:flosejo0604@gmail.com" class="bottom-info-item">
                <img src="img/gmail.png" alt="Correo">
                <span>flosejo0604@gmail.com</span>
            </a>
            
            <a href="https://facebook.com/tu-perfil" class="bottom-info-item" target="_blank">
                <img src="img/facebook.png" alt="Facebook">
                <span>Chucho Sánchez</span>
            </a>
        </div>
        
    </div>
</section>
  </body>
</html>
